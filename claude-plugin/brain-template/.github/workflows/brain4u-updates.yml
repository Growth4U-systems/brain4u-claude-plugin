name: Update Brain4U logic
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: brain4u-logic-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply official released logic and preserve customized files
        run: node scripts/update-brain4u.mjs
      - name: Check the Brain
        run: bash lint-brain.sh
      - name: Publish the logic update in this private Brain
        run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name 'Brain4U Updates'
          git config user.email 'brain4u-updates@users.noreply.github.com'
          git add --all
          git commit -m 'Update official Brain4U logic; preserve private context'
          git push origin HEAD:main
